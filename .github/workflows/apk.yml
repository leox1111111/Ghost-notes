name: Buduj APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Narzedzia
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
          pip install buildozer==1.5.0 cython==0.29.37
          mkdir -p ~/.android
          cp .ci/debug.keystore ~/.android/debug.keystore

      - name: Pamiec podreczna (SDK, NDK)
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Budowanie
        run: yes | buildozer android debug

      - name: Nazwa pliku
        run: cp bin/*.apk GhostNotes.apk

      - name: Publikacja do pobrania
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Ghost Notes 1.0.${{ github.run_number }}
          body: Pobierz GhostNotes.apk i zainstaluj na telefonie.
          files: GhostNotes.apk
          make_latest: true
